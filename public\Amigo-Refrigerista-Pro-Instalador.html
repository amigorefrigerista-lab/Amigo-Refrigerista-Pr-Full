<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070e1c" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AmigoRefri" />
  <title>Instalador — Amigo Refrigerista Pro</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top, #0c2244 0%, #070e1c 65%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(14, 165, 233, 0.45);
      border-radius: 28px;
      padding: 36px 26px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75);
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      margin: 0 auto 18px;
      display: block;
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.45);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(14, 165, 233, 0.15);
      border: 1px solid rgba(14, 165, 233, 0.35);
      color: #38bdf8;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 { font-size: 22px; font-weight: 900; margin-bottom: 8px; color: #ffffff; }
    p { font-size: 13.5px; color: #cbd5e1; margin-bottom: 24px; line-height: 1.55; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 15px 20px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(90deg, #0ea5e9, #22d3ee);
      color: #020617;
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(14, 165, 233, 0.35);
      margin-bottom: 12px;
    }
    .btn-secondary {
      display: inline-block;
      width: 100%;
      padding: 13px 18px;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #e2e8f0;
      font-weight: 700;
      font-size: 13px;
      text-decoration: none;
    }
    .status {
      margin-top: 16px;
      font-size: 12px;
      color: #34d399;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://ais-pre-qra27imdzdc4xbsitf6zdr-546064254082.us-east1.run.app/icon-512.png" onerror="this.src='/icon-512.png'" alt="Amigo Refrigerista Pro" class="logo" />
    <span class="badge">Instalador Oficial v1.0</span>
    <h1>Amigo Refrigerista Pro</h1>
    <p>Arquivo de instalação e inicialização direta para celular (Android / iOS) e computador.</p>
    <button id="installBtn" class="btn" type="button">
      Instalar e Abrir Aplicativo Agora
    </button>
    <a id="openLink" href="https://ais-pre-qra27imdzdc4xbsitf6zdr-546064254082.us-east1.run.app" class="btn-secondary">
      Acessar Plataforma Diretamente
    </a>
    <div id="statusMsg" class="status">Pronto para instalar no seu aparelho</div>
  </div>

  <script>
    (function () {
      var targetOrigin = window.location.protocol.indexOf('http') === 0
        ? window.location.origin
        : 'https://ais-pre-qra27imdzdc4xbsitf6zdr-546064254082.us-east1.run.app';

      var openLink = document.getElementById('openLink');
      if (openLink) openLink.href = targetOrigin;

      if ('serviceWorker' in navigator && window.location.protocol.indexOf('http') === 0) {
        navigator.serviceWorker.register('/sw.js').catch(function () {});
      }

      var deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        var statusEl = document.getElementById('statusMsg');
        if (statusEl) statusEl.textContent = 'Instalador nativo detectado — Toque no botão azul acima!';
      });

      var installBtn = document.getElementById('installBtn');
      if (installBtn) {
        installBtn.addEventListener('click', function () {
          if (deferredPrompt) {
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(function () {
              deferredPrompt = null;
              window.location.href = targetOrigin;
            });
          } else {
            window.location.href = targetOrigin;
          }
        });
      }
    })();
  </script>
</body>
</html>
